name: retro-midi-player-opl3-gm
base: core24
version: '1.1.2'
title: OPL3 RetroWave MIDI Player
license: AGPL-3.0-or-later
contact: https://github.com/carlosbravoa/retro-midi-player-opl3-gm/issues
issues: https://github.com/carlosbravoa/retro-midi-player-opl3-gm/issues
source-code: https://github.com/carlosbravoa/retro-midi-player-opl3-gm
website: https://github.com/carlosbravoa/retro-midi-player-opl3-gm
summary: MIDI player for PC speakers, a RetroWave OPL3 board or a MIDI synth
description: |
  A MIDI file player with three ways to hear your music. Pick one with the
  OUT button and switch at any time, even mid-song:

  - **PC speakers**: authentic Yamaha OPL3 FM sound, the Sound Blaster-era
    chip of 90s PC games, synthesized with libADLMIDI and an accurate OPL3
    emulator. No extra hardware needed.
  - **RetroWave OPL3 Express board**: the same FM synthesis played on a real
    YMF262 chip over USB, register for register, for genuine hardware sound.
  - **External MIDI synth**: the original MIDI (including SysEx) sent through
    ALSA to a General MIDI module or synth (Roland SC-55, Yamaha MU, etc.),
    which plays it with its own voices.

  **Features**
  - Dozens of built-in OPL3 instrument banks from classic games and sound
    drivers (AIL, HMI, DMX, Apogee, Windows 9x and more), switchable while a
    song plays
  - Live 18-channel OPL3 visualizer in three styles (LED, neon, spectrum).
    Click a channel to mute it, right-click to solo it
  - Winamp-style playlist: load whole folders (optionally with subfolders),
    shuffle, repeat one track or the whole list, click the progress bar to seek
  - Tempo control, keyboard shortcuts, and settings that are remembered
    between runs

  PC audio, display and home-folder access work automatically. For the board
  or an external synth, connect the matching interface once:
    snap connect retro-midi-player-opl3-gm:serial-port   # RetroWave OPL3 board
    snap connect retro-midi-player-opl3-gm:alsa          # external MIDI device

confinement: strict
grade: stable

platforms:
  amd64:
  arm64:

layout:
  # libasound (used for the external-MIDI sequencer) reads its config from the
  # normal system path; map it to the bundled copy so it resolves in the sandbox.
  /usr/share/alsa:
    bind: $SNAP/usr/share/alsa

apps:
  retro-midi-player-opl3-gm:
    command: bin/opl3-launch
    # The gnome extension wires up graphics, fonts, portals, GTK (for the
    # zenity "Open Folder" dialog) and PulseAudio audio.
    extensions: [gnome]
    plugs:
      - audio-playback     # PC-speaker output (SDL via PulseAudio)
      - alsa               # external-MIDI output (ALSA sequencer) — connect manually
      - serial-port        # RetroWave OPL3 Express board — connect manually
      - home               # load MIDI folders from your home directory
      - removable-media    # load MIDI folders from USB drives

parts:
  # Fetch libADLMIDI during the (networked) pull phase so the build itself is
  # offline/reproducible. build.sh compiles it — including its internal headers,
  # which the player's fan-out chip needs and which are not installed by cmake.
  libadlmidi-src:
    plugin: dump
    source: https://github.com/Wohlstand/libADLMIDI.git
    source-type: git
    source-depth: 1
    organize:
      '*': libADLMIDI/
    prime:
      - -*        # staged for the player part only, not shipped as-is

  player:
    after: [libadlmidi-src]
    plugin: nil
    source: .
    override-pull: |
      craftctl default
      # Drop any local build artifacts copied from the working tree.
      rm -rf "$CRAFT_PART_SRC/libADLMIDI" "$CRAFT_PART_SRC/build" \
             "$CRAFT_PART_SRC/opl3-rw-midi-player"
    override-build: |
      # Use the pre-fetched libADLMIDI; build.sh sees it present and skips cloning.
      cp -a "$CRAFT_STAGE/libADLMIDI" "$CRAFT_PART_BUILD/libADLMIDI"
      ./build.sh
      install -Dm755 opl3-rw-midi-player "$CRAFT_PART_INSTALL/bin/opl3-rw-midi-player"
      install -Dm755 snap/local/opl3-launch "$CRAFT_PART_INSTALL/bin/opl3-launch"
    build-packages:
      - g++
      - cmake
      - make
      - git
      - pkg-config
      - libsdl2-dev
      - libasound2-dev
    stage-packages:
      - libsdl2-2.0-0
      - libpulse0
      # Name the real ALSA lib: on core24 "libasound2" is a virtual package,
      # and apt may satisfy it with liboss4-salsa-asound2 (an OSS emulation
      # that needs libOSSlib.so, which isn't shipped), breaking launch.
      - libasound2t64
      - libasound2-data
      - zenity
